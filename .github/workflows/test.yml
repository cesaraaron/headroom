name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly backstop so a broken push/PR trigger cannot silently skip the gates.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    name: Unit Tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system dependencies
        # apt mirrors occasionally fail DNS resolution; retry so a transient
        # network error is not reported as a build failure (run 807a05f).
        run: |
          set -e
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y libasound2-dev libpipewire-0.3-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check the minimal build and the no-AU snapshot branch
        # `cargo test` covers the default feature set. This covers the documented
        # `--no-default-features` build and the same no-AU golden without `au`.
        run: |
          cargo check --no-default-features
          cargo test --no-default-features --features clap

  # The AudioUnit host (`--features au`) only compiles on macOS, so its tests run
  # here and not in the Linux job. The fidelity baseline was generated on
  # aarch64-apple-darwin, so the `--check` gate lives here too.
  macos:
    name: Tests + Fidelity (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests (release, all features, incl. AU)
        # Linux covers the debug build; this job covers the release build the
        # audio engine actually ships in.
        run: cargo test --release --all-features

      - name: Check the fidelity baseline
        # Renders every bundled preset over the synthetic corpus and fails on any
        # drift beyond the harness tolerances (loudness, crest, correlation,
        # centroid, LTAS) — the guard on preset/DSP voicing regressions.
        run: cargo run --release --example fidelity_render -- --check docs/fidelity/baseline-synth-48k.toml
