name        = "Pink Floyd — Comfortably Numb (Outro Solo)"
description = "Inspired by the outro 'Comfortably Numb' solo (The Wall, 1979): a thick Big Muff-style fuzz into a Hiwatt DR103 and Fane-loaded WEM 4×12, an Electric Mistress-style flanger, clean digital repeats and a big hall. Not a verified session rig."
tags        = ["pink floyd", "lead", "classic rock"]
year        = 1979

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Slow release so the long, held bends and their delay/reverb tails ring out.
[noise_gate]
enabled   = true
threshold = 0.14
release   = 0.50

# ── Compressor ────────────────────────────────────────────────────────────────
# 2026-10-13 punch pass: sustain 0.45 → 0.38 un-squashes the pick attack,
# attack 0.34 → 0.42 (~21 ms) lets the transient through before the squash.
[compressor]
enabled = true
sustain = 0.38
attack  = 0.42
level   = 0.52

# ── Big Muff (Fuzz) ───────────────────────────────────────────────────────────
# 2026-10-13 drive pass: fuzz 0.32 → 0.38 for more grind. Level stays 0.45 —
# the loudness is already right; this adds hair, not volume. Pre-EQ low cut
# below keeps the extra drive off the low E.
[fuzz]
enabled = true
type    = 0.0   # 0 = Big Muff (the Ram's-Head voice)
fuzz  = 0.38
tone  = 0.60
level = 0.45

# TS off — the Muff is the only dirt.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# Trims the lows (-3.6 dB @ 100 Hz) BEFORE the Hiwatt clips, so the extra
# drive above lands on the mids, not the low E. Mid 0.55 → 0.60 pushes the
# pick punch at 650 Hz (+2.4 dB) into the grind.
[preamp_eq]
enabled = true
low  = 0.35
mid  = 0.60
high = 0.54

# Uni-Vibe off — the outro swirl is the Mistress-style flanger.
[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

# ── Amp ───────────────────────────────────────────────────────────────────────
# 2026-10-13 drive pass: gain 0.40 → 0.48 pushes the Hiwatt preamp harder
# (the Gilmour trick is a loud clean amp hit by pedals — this is the amp half
# of that). Bass stays floored; the pre-EQ handles the lows.
[amp]
model  = "hiwatt"
gain   = 0.48
bass   = 0.20
mid    = 0.28
treble = 0.65
presence = 0.56
master = 0.50

# ── Cabinet ───────────────────────────────────────────────────────────────────
# WEM 4×12 with Fane Crescendos, near on-axis, light ribbon, a touch of room. No
# dark cab here — the outro needs to sing, not smoulder.
[cabinet]
model     = "wem"
mic_pos   = 0.52
mic_blend = 0.22
mic_room  = 0.22

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# Low end trimmed again at the end of the chain, mids forward, air on top.
[eq]
enabled = false
low  = 0.40
mid  = 0.58
high = 0.55

# Chorus off — the Mistress is a flanger, modelled in [flanger] below.
[chorus]
enabled = false
rate  = 0.20
depth = 0.50
mix   = 0.0

# ── Flanger (Electric Mistress) ───────────────────────────────────────────────
# 2026-10-13 dry pass: mix 0.26 → 0.18. The swirl stays audible but stops
# washing the pick attack.
[flanger]
enabled  = true
rate     = 0.18
depth    = 0.42
feedback = 0.25
mix      = 0.18
type     = 1.0   # Electric Mistress (mono)

# ── Delay ─────────────────────────────────────────────────────────────────────
# 2026-10-13 dry pass: mix 0.26 → 0.17, feedback 0.36 → 0.30. 2026-10-18: the
# studio sources point to a digital delay, so the ~450 ms repeat is now a clean
# digital one (A/B confirmed against the Echorec) sitting behind the dry note.
[delay]
type     = 0.0   # Digital ping-pong
enabled  = true
time     = 0.90
feedback = 0.30
mix      = 0.17

# ── Reverb ────────────────────────────────────────────────────────────────────
# 2026-10-13 dry pass: mix 0.20 → 0.12. Room stays big, just further back.
[reverb]
enabled = true
room = 0.55
damp = 0.48
mix  = 0.12

[master]
width = 1.0
