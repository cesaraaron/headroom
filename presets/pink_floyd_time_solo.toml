name        = "Pink Floyd — Time (Solo)"
description = "Inspired by the 'Time' solo (The Dark Side of the Moon, 1973): a Fuzz Face into a Hiwatt DR103 and Fane-loaded WEM 4×12, with a Uni-Vibe-style swirl and a tape echo. Biting and vocal, not a fuzz wall. Not a verified session rig."
tags        = ["pink floyd", "lead", "classic rock"]
year        = 1973

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Moderate — the Time solo is articulate and choppy, so the gate closes a little
# faster than on the ballads.
[noise_gate]
enabled   = true
threshold = 0.14
release   = 0.36

# ── Compressor ────────────────────────────────────────────────────────────────
# A light squeeze only. Time is played with attack and bite — heavy compression
# would flatten the phrasing that makes the solo speak.
[compressor]
enabled = true
sustain = 0.42
attack  = 0.30
level   = 0.52

# ── Fuzz Face ─────────────────────────────────────────────────────────────────
# 2026-10-15: level 0.40 → 0.46 slams the Hiwatt harder with the SAME
# clip character (more drive, no extra low-string octave mush — that lives
# behind the fuzz knob, which stays put).
[fuzz]
enabled = true
type    = 0.5   # 0 = Big Muff, 0.5 = Fuzz Face, 1 = Tone Bender
fuzz    = 0.58
tone    = 0.62
level   = 0.46

# TS off — the fuzz into the driven amp is the sound.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# 2026-10-14 clarity pass: enabled to strip fuzz-made low mud (-2.9 dB @
# 100 Hz) BEFORE the vibe and Hiwatt, and push vocal clarity (+1.9 dB @
# 650 Hz). This is the low-note fix — cutting here keeps the drive's teeth
# while the wool never reaches the swirl or the amp.
[preamp_eq]
enabled = true
low  = 0.38
mid  = 0.58
high = 0.54

# ── Uni-Vibe ──────────────────────────────────────────────────────────────────
# 2026-10-15: depth 0.22 → 0.18, mix 0.15 → 0.10. Barely a halo — at
# 10% wet the notch can't cancel the root anymore, it only breathes on it.
[uni_vibe]
enabled = true
rate    = 0.20
depth   = 0.18
mix     = 0.10
mode    = 0.0   # 0 = chorus, 1 = vibrato

# ── Amp ───────────────────────────────────────────────────────────────────────
# 2026-10-15: gain 0.56 → 0.58 takes the hotter Fuzz Face feed; clarity
# courtesy of the pre-EQ low cut doing the mud duty instead.
[amp]
model  = "hiwatt"
gain   = 0.58
bass   = 0.25
mid    = 0.36
treble = 0.62
presence = 0.58
master = 0.30

# ── Cabinet ───────────────────────────────────────────────────────────────────
# WEM 4×12 with Fane Crescendos — the bright, aggressive cab Gilmour used with
# the Hiwatt, leaner and more open than a Greenback.
[cabinet]
model     = "wem"
mic_pos   = 0.54
mic_blend = 0.22
mic_room  = 0.24

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# A mid-forward finish with the lows kept in check and a little air up top.
[eq]
enabled = false
low  = 0.42
mid  = 0.56
high = 0.58

# Chorus off — the Uni-Vibe carries the modulation, as on the record.
[chorus]
enabled = false
rate  = 0.22
depth = 0.40
mix   = 0.0

[flanger]
enabled  = false
rate     = 0.20
depth    = 0.30
feedback = 0.20
mix      = 0.0

# ── Delay ─────────────────────────────────────────────────────────────────────
# 2026-10-15 dry pass: mix 0.13 → 0.10, feedback 0.27 → 0.24. The Echorec
# answers once, clearly, instead of hovering.
[delay]
type     = 0.5   # Echorec drum echo
enabled  = true
time     = 0.62
feedback = 0.24
mix      = 0.10

# ── Reverb ────────────────────────────────────────────────────────────────────
# 2026-10-15 dry pass: mix 0.10 → 0.08.
[reverb]
enabled = true
room = 0.48
damp = 0.48
mix  = 0.08

[master]
width = 1.0
