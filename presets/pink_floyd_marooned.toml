name        = "Pink Floyd — Marooned"
description = "Inspired by 'Marooned' (The Division Bell, 1994): a Tube Driver lead into a Hiwatt DR103 and Fane-loaded WEM 4×12, with a subtle Whammy for the dive and a clean digital delay. Gilmour's 1990s lead sound is the Tube Driver, not a Big Muff. Not a verified session rig."
tags        = ["pink floyd", "lead", "ambient"]
year        = 1994

[noise_gate]
enabled   = true
threshold = 0.09
release   = 0.48

[compressor]
enabled = true
voice   = 1.0
sustain = 0.38
attack  = 0.28
level   = 0.52

[fuzz]
enabled = false
type    = 0.0
model   = 0.0
fuzz    = 0.20
tone    = 0.60
level   = 0.50
guitar  = 1.0

# A subtle Whammy: pitch 0.35 is about a fifth down, low mix so it colours the
# dive without turning the part into a synth.
[pitch]
enabled = true
pitch   = 0.35
mix     = 0.25
tone    = 0.60

[tube_screamer]
enabled = false
drive   = 0.30
tone    = 0.55
level   = 0.70

[distortion]
enabled = false
drive   = 0.40
tone    = 0.50
level   = 0.65

# Tube Driver at the distortion setting: the Marooned lead is thick and smooth.
[tube_driver]
enabled = true
drive   = 0.62
high    = 0.44
low     = 0.60
level   = 0.56

[preamp_eq]
enabled = true
low     = 0.40
mid     = 0.56
high    = 0.54

[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

[amp]
model    = "hiwatt"
gain     = 0.38
bass     = 0.30
mid      = 0.42
treble   = 0.58
presence = 0.54
master   = 0.42

[cabinet]
model     = "wem"
mic_pos   = 0.52
mic_blend = 0.26
mic_room  = 0.28

[eq]
enabled = false
low     = 0.44
mid     = 0.56
high    = 0.56

[chorus]
enabled = true
rate    = 0.28
depth   = 0.38
mix     = 0.12

[flanger]
enabled  = false
type     = 1.0
rate     = 0.18
depth    = 0.30
feedback = 0.20
mix      = 0.0

[rotary]
enabled = false
speed   = 0.0
ramp    = 0.35
depth   = 0.50
mix     = 0.0
balance = 0.50

[delay]
type     = 0.0
enabled  = true
time     = 0.72
feedback = 0.32
mix      = 0.24

[reverb]
enabled = true
room    = 0.58
damp    = 0.48
mix     = 0.22

[master]
width = 1.0
