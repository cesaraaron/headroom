name        = "Pink Floyd — Echoes (Seagull)"
description = "An approximation of the 'seagull' effect from 'Echoes': a wah parked at a fixed cocked position into a long, high-feedback delay. On the record the wah was reversed and the delay long; this rig has no reverse switch, so the parked treadle and the repeats are the closest it gets. Inspired by, not a verified session rig."
tags        = ["pink floyd", "texture", "experimental"]
year        = 2006

[noise_gate]
enabled   = true
threshold = 0.08
release   = 0.50

[compressor]
enabled = false
voice   = 0.0
sustain = 0.30
attack  = 0.30
level   = 0.50

# A Big Muff is not part of the seagull itself; kept off so the wah and delay
# stay legible. Turn it on low for the funky Echoes part.
[fuzz]
enabled = false
type    = 0.0
model   = 0.30
fuzz    = 0.25
tone    = 0.55
level   = 0.45
guitar  = 1.0

# Manual treadle, parked bright and narrow.
[wah]
enabled  = true
mode     = 1.0
position = 0.82
freq     = 0.65
sens     = 0.50
q        = 0.72
mix      = 1.0

[tube_screamer]
enabled = false
drive   = 0.30
tone    = 0.55
level   = 0.70

[distortion]
enabled = false
drive   = 0.40
tone    = 0.50
level   = 0.65

[tube_driver]
enabled = false
drive   = 0.20
high    = 0.55
low     = 0.55
level   = 0.60

[preamp_eq]
enabled = false
low     = 0.50
mid     = 0.58
high    = 0.52

[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

[amp]
model    = "hiwatt"
gain     = 0.34
bass     = 0.32
mid      = 0.42
treble   = 0.58
presence = 0.54
master   = 0.40

[cabinet]
model     = "wem"
mic_pos   = 0.50
mic_blend = 0.24
mic_room  = 0.30

[eq]
enabled = false
low     = 0.44
mid     = 0.56
high    = 0.58

[chorus]
enabled = false
rate    = 0.30
depth   = 0.40
mix     = 0.0

[flanger]
enabled  = false
type     = 1.0
rate     = 0.18
depth    = 0.30
feedback = 0.20
mix      = 0.0

[rotary]
enabled = false
speed   = 0.0
ramp    = 0.35
depth   = 0.50
mix     = 0.0
balance = 0.50

# Long, repeating, and deliberately unstable-sounding: feedback high, mix wet.
[delay]
type     = 0.0
enabled  = true
time     = 0.58
feedback = 0.62
mix      = 0.42

[reverb]
enabled = true
room    = 0.62
damp    = 0.45
mix     = 0.24

[master]
width = 1.0
