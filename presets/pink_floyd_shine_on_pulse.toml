name        = "Pink Floyd — Shine On You Crazy Diamond (Pulse)"
description = "Inspired by the 1994 PULSE performances of 'Shine On You Crazy Diamond': a Boss CS-2-style compressor and a Tube Driver into a Hiwatt DR103 and Fane-loaded WEM 4×12, with a CE-2 chorus, an RA-200-family rotary and a clean digital delay. The lead is the Tube Driver, not a Big Muff. Not a verified session rig."
tags        = ["pink floyd", "lead", "classic rock"]
year        = 1994

[noise_gate]
enabled   = true
threshold = 0.10
release   = 0.40

# Boss CS-2: the 1987-2004 compressor, darker and smoother than the Dyna Comp.
[compressor]
enabled = true
voice   = 1.0
sustain = 0.40
attack  = 0.28
level   = 0.52

# The PULSE lead is the Tube Driver, so the Muff stays off.
[fuzz]
enabled = false
type    = 0.0
model   = 0.0
fuzz    = 0.20
tone    = 0.60
level   = 0.50
guitar  = 1.0

[tube_screamer]
enabled = false
drive   = 0.30
tone    = 0.55
level   = 0.70

[distortion]
enabled = false
drive   = 0.40
tone    = 0.50
level   = 0.65

# Tube Driver #2, the overdrive setting: level 11:30, hi 11:30, lo 3:00, drive 4:00.
[tube_driver]
enabled = true
drive   = 0.35
high    = 0.46
low     = 0.66
level   = 0.56

[preamp_eq]
enabled = true
low     = 0.40
mid     = 0.55
high    = 0.55

[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

[amp]
model    = "hiwatt"
gain     = 0.40
bass     = 0.30
mid      = 0.40
treble   = 0.60
presence = 0.55
master   = 0.42

[cabinet]
model     = "wem"
mic_pos   = 0.52
mic_blend = 0.24
mic_room  = 0.26

[eq]
enabled = false
low     = 0.45
mid     = 0.55
high    = 0.55

[chorus]
enabled = true
rate    = 0.35
depth   = 0.45
mix     = 0.18

[flanger]
enabled  = false
type     = 1.0
rate     = 0.18
depth    = 0.30
feedback = 0.20
mix      = 0.0

# The RA-200/Doppola family: the spinning-speaker swirl, mixed under the dry.
[rotary]
enabled = true
speed   = 0.0
ramp    = 0.35
depth   = 0.50
mix     = 0.20
balance = 0.50

# TC 2290-style clean digital repeat, ~370 ms (Gilmourish's Shine On time).
[delay]
type     = 0.0
enabled  = true
time     = 0.74
feedback = 0.35
mix      = 0.22

[reverb]
enabled = true
room    = 0.50
damp    = 0.50
mix     = 0.18

[master]
width = 1.0
