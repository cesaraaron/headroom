name        = "Pink Floyd — Sorrow (1994 Live)"
description = "Inspired by the 1994 PULSE arrangement of 'Sorrow': a Sovtek 'Civil War' Big Muff into a Tube Driver used as a clean boost, then a Hiwatt DR103 and Fane-loaded WEM 4×12, with a CE-2 chorus and a long digital delay. The record's studio intro is a different chain (HM-2 into a small Fender), so this is the live arrangement. Not a verified session rig."
tags        = ["pink floyd", "lead", "classic rock"]
year        = 1994

[noise_gate]
enabled   = true
threshold = 0.12
release   = 0.38

[compressor]
enabled = true
voice   = 1.0
sustain = 0.42
attack  = 0.26
level   = 0.54

# Sovtek "Civil War": model 0.5-0.75 on the MUFF knob. Smoother and bassier
# than the Ram's Head, with brighter mids and less gain — the PULSE sound.
[fuzz]
enabled = true
type    = 0.0
model   = 0.60
fuzz    = 0.55
tone    = 0.42
level   = 0.50
guitar  = 1.0

[tube_screamer]
enabled = false
drive   = 0.30
tone    = 0.55
level   = 0.70

[distortion]
enabled = false
drive   = 0.40
tone    = 0.50
level   = 0.65

# Tube Driver #1 set as a clean volume boost (drive 8:00, level 2:00).
[tube_driver]
enabled = true
drive   = 0.08
high    = 0.58
low     = 0.58
level   = 0.68

[preamp_eq]
enabled = true
low     = 0.36
mid     = 0.56
high    = 0.54

[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

[amp]
model    = "hiwatt"
gain     = 0.42
bass     = 0.28
mid      = 0.42
treble   = 0.56
presence = 0.54
master   = 0.44

[cabinet]
model     = "wem"
mic_pos   = 0.54
mic_blend = 0.26
mic_room  = 0.26

[eq]
enabled = false
low     = 0.44
mid     = 0.56
high    = 0.54

[chorus]
enabled = true
rate    = 0.30
depth   = 0.45
mix     = 0.15

[flanger]
enabled  = false
type     = 1.0
rate     = 0.18
depth    = 0.30
feedback = 0.20
mix      = 0.0

[rotary]
enabled = false
speed   = 0.0
ramp    = 0.35
depth   = 0.50
mix     = 0.0
balance = 0.50

# Sorrow's long repeat is ~750 ms; the DELAY knob tops out at 500 ms, so this
# is the longest the rig can do. Use two repeats rather than one long one.
[delay]
type     = 0.0
enabled  = true
time     = 0.98
feedback = 0.42
mix      = 0.24

[reverb]
enabled = true
room    = 0.52
damp    = 0.50
mix     = 0.18

[master]
width = 1.0
