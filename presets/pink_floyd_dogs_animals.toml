name        = "Pink Floyd — Dogs (Animals)"
description = "Inspired by 'Dogs' (Animals, 1977): a Ram's Head Big Muff into a Colorsound Power Boost, then a Hiwatt DR103 and Fane-loaded WEM 4×12, with a Yamaha RA-200 rotary and a digital echo. The 1975-77 order puts the boost after the fuzz, which is what gives the hairy, splatty Animals lead. Tuned down a step. Not a verified session rig."
tags        = ["pink floyd", "lead", "classic rock"]
year        = 1977

[noise_gate]
enabled   = true
threshold = 0.14
release   = 0.40

[compressor]
enabled = true
voice   = 0.0
sustain = 0.35
attack  = 0.32
level   = 0.52

# Ram's Head: the model 0 voice, the Animals and Wall studio Muff.
[fuzz]
enabled = true
type    = 0.0
model   = 0.0
fuzz    = 0.62
tone    = 0.45
level   = 0.46
guitar  = 1.0

[tube_screamer]
enabled = false
drive   = 0.30
tone    = 0.55
level   = 0.70

[distortion]
enabled = false
drive   = 0.40
tone    = 0.50
level   = 0.65

[tube_driver]
enabled = false
drive   = 0.20
high    = 0.55
low     = 0.55
level   = 0.60

# Colorsound Power Boost, after the fuzz (the 1975-77 order).
[boost]
enabled = true
gain    = 0.55
treble  = 0.58
bass    = 0.46

[preamp_eq]
enabled = true
low     = 0.38
mid     = 0.56
high    = 0.52

[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

[amp]
model    = "hiwatt"
gain     = 0.38
bass     = 0.28
mid      = 0.40
treble   = 0.58
presence = 0.56
master   = 0.44

[cabinet]
model     = "wem"
mic_pos   = 0.52
mic_blend = 0.28
mic_room  = 0.26

[eq]
enabled = false
low     = 0.44
mid     = 0.56
high    = 0.52

[chorus]
enabled = false
rate    = 0.35
depth   = 0.45
mix     = 0.0

[flanger]
enabled  = false
type     = 1.0
rate     = 0.18
depth    = 0.30
feedback = 0.20
mix      = 0.0

# The Yamaha RA-200 was on most of the Animals rig, mixed under the dry.
[rotary]
enabled = true
speed   = 0.0
ramp    = 0.40
depth   = 0.55
mix     = 0.22
balance = 0.45

[delay]
type     = 0.0
enabled  = true
time     = 0.88
feedback = 0.26
mix      = 0.12

[reverb]
enabled = true
room    = 0.48
damp    = 0.48
mix     = 0.12

[master]
width = 1.0

# Fuzz into the Power Boost: the 1975-77 order (the 1972-74 board had the
# boost first). The rotary sits after the cab.
[chain]
order = [
    "gate",
    "whammy",
    "wah",
    "comp",
    "fuzz",
    "boost",
    "ts",
    "ds",
    "metal",
    "rat",
    "tube_driver",
    "preeq",
    "vibe",
    "amp",
    "cab",
    "rotary",
    "geq",
    "eq",
    "flanger",
    "chorus",
    "phaser",
    "trem",
    "delay",
    "reverb",
]
