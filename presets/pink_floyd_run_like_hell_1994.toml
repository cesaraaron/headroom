name        = "Pink Floyd — Run Like Hell (1994)"
description = "Inspired by the 1994 PULSE arrangement of 'Run Like Hell': a compressed clean Hiwatt DR103 into a Fane-loaded WEM 4×12, with a CE-2 chorus, an RA-200-family rotary and a ~380 ms digital delay. The 1994 patch was compressor + chorus + Doppolas; the Tube Driver version is the 2016 tour. Not a verified session rig."
tags        = ["pink floyd", "rhythm", "classic rock"]
year        = 1994

[noise_gate]
enabled   = true
threshold = 0.12
release   = 0.35

[compressor]
enabled = true
voice   = 1.0
sustain = 0.48
attack  = 0.24
level   = 0.54

[fuzz]
enabled = false
type    = 0.0
model   = 0.0
fuzz    = 0.20
tone    = 0.60
level   = 0.50
guitar  = 1.0

[tube_screamer]
enabled = false
drive   = 0.30
tone    = 0.55
level   = 0.70

[distortion]
enabled = false
drive   = 0.40
tone    = 0.50
level   = 0.65

[tube_driver]
enabled = false
drive   = 0.20
high    = 0.55
low     = 0.55
level   = 0.60

[preamp_eq]
enabled = false
low     = 0.50
mid     = 0.55
high    = 0.52

[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

[amp]
model    = "hiwatt"
gain     = 0.30
bass     = 0.30
mid      = 0.42
treble   = 0.58
presence = 0.55
master   = 0.42

[cabinet]
model     = "wem"
mic_pos   = 0.50
mic_blend = 0.24
mic_room  = 0.28

[eq]
enabled = false
low     = 0.46
mid     = 0.56
high    = 0.54

[chorus]
enabled = true
rate    = 0.32
depth   = 0.50
mix     = 0.22

[flanger]
enabled  = false
type     = 1.0
rate     = 0.18
depth    = 0.30
feedback = 0.20
mix      = 0.0

[rotary]
enabled = true
speed   = 1.0
ramp    = 0.30
depth   = 0.45
mix     = 0.18
balance = 0.50

# ~380 ms, the documented Run Like Hell delay time.
[delay]
type     = 0.0
enabled  = true
time     = 0.76
feedback = 0.28
mix      = 0.20

[reverb]
enabled = true
room    = 0.45
damp    = 0.50
mix     = 0.14

[master]
width = 1.0
