name        = "Pink Floyd — Comfortably Numb (Solo 1)"
description = "Inspired by the first 'Comfortably Numb' solo (The Wall, 1979): a Big Muff-style fuzz into a Hiwatt DR103 and Fane-loaded WEM 4×12, a hint of flanger and a long tape echo. Bright and vocal. Not a verified session rig."
tags        = ["pink floyd", "lead", "classic rock"]
year        = 1979

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Light and slow: the Muff's hiss is real, but a fading bend has to ring out.
[noise_gate]
enabled   = true
threshold = 0.10
release   = 0.45

# ── Compressor ────────────────────────────────────────────────────────────────
# Was 0.52 — eased to 0.45 so the low strings stop slamming the Muff first.
# Keeps the singing sustain without the low-E heaviness.
[compressor]
enabled = true
sustain = 0.45
attack  = 0.36
level   = 0.52

# ── Big Muff (Fuzz) ───────────────────────────────────────────────────────────
# Was fuzz 0.40 / level 0.30: fully squared but quiet into the amp. 0.34 backs
# the square off, 0.42 restores drive so it sings louder with less mush.
# Phase 7 joint re-voice: level pulled back so the leaned stack stays a voice.
[fuzz]
enabled = true
type    = 0.0   # 0 = Big Muff (the Ram's-Head voice)
fuzz  = 0.34
tone  = 0.68
level = 0.42

# TS off — the Muff and the amp do the work.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# Enabled 2026-10-13: trims the lows (-3.6 dB @ 100 Hz) BEFORE the Hiwatt
# clips so the low strings stay clear — the old mud lived here.
[preamp_eq]
enabled = true
low  = 0.35
mid  = 0.58
high = 0.54

# Uni-Vibe off — the Numb solo uses the Mistress-style flanger, not the vibe.
[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

# ── Amp ───────────────────────────────────────────────────────────────────────
# Hiwatt DR103 at modest gain: enough to bloom and sing, with headroom so the
# Muff is a voice, not the whole sound. Phase 7 joint re-voice: with the model's
# structural lows leaned, bass/mid sit near noon — was 0.42/0.60 over the
# +4 dB body lift and WEM pile-up.
[amp]
model  = "hiwatt"
gain   = 0.34
bass   = 0.20
mid    = 0.30
treble = 0.62
presence = 0.56
master = 0.48

# ── Cabinet ───────────────────────────────────────────────────────────────────
# WEM 4×12 with Fane Crescendos, near on-axis with a light ribbon blend — bright
# and present, with a little room for depth.
[cabinet]
model     = "wem"
mic_pos   = 0.50
mic_blend = 0.25
mic_room  = 0.28

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# Gentle final shaping: lows tucked, mids reinforced, a breath of air on top.
[eq]
enabled = false
low  = 0.42
mid  = 0.58
high = 0.56

# Chorus off — the Mistress is a flanger, modelled in [flanger] below.
[chorus]
enabled = false
rate  = 0.18
depth = 0.35
mix   = 0.0

# ── Flanger (Electric Mistress) ───────────────────────────────────────────────
# The Mistress shimmer: shallow and slow, a halo around the note rather than a
# jet-plane sweep — this is the modulation on the Numb solo, not a chorus.
[flanger]
enabled  = true
rate     = 0.15
depth    = 0.30
feedback = 0.20
mix      = 0.20
type     = 1.0   # Electric Mistress (mono)

# ── Delay ─────────────────────────────────────────────────────────────────────
# Echorec repeat: a long ~440 ms echo sitting behind the phrase. Low
# feedback and mix keep it a dimension, not a fog.
[delay]
type     = 0.5   # Echorec drum echo
enabled  = true
time     = 0.88
feedback = 0.30
mix      = 0.22

# ── Reverb ────────────────────────────────────────────────────────────────────
# A medium, fairly damped room — depth without smearing the articulation.
[reverb]
enabled = true
room = 0.45
damp = 0.50
mix  = 0.16

[master]
width = 1.0
