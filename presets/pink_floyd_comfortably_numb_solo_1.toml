name        = "Pink Floyd — Comfortably Numb (Solo 1)"
description = "Inspired by the first 'Comfortably Numb' solo (The Wall, 1979): a Big Muff into a Hiwatt DR103 and Fane-loaded WEM 4×12, a low-mix chorus standing in for the Yamaha RA-200, a clean Power-Boost-style push and a digital delay. Voiced with a full bridge humbucker. Not a verified session rig."
tags        = ["pink floyd", "lead", "classic rock"]
year        = 1979

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Light and slow: the Muff's hiss is real, but a fading bend has to ring out.
[noise_gate]
enabled   = true
threshold = 0.10
release   = 0.45

# ── Compressor ────────────────────────────────────────────────────────────────
# Was 0.52 — eased to 0.45 so the low strings stop slamming the Muff first.
# Keeps the singing sustain without the low-E heaviness.
[compressor]
enabled = true
sustain = 0.45
attack  = 0.36
level   = 0.52

# ── Big Muff (Fuzz) ───────────────────────────────────────────────────────────
# 2026-10-18 low-end clarity pass: fuzz 0.34 → 0.22. A full bridge humbucker
# feeds the Muff's low end much harder than the record's single coil; backing
# the sustain off keeps the drive while the lows stay dry. The clean boost
# below makes up the push into the Hiwatt.
[fuzz]
enabled = true
type    = 0.0   # 0 = Big Muff (the Ram's-Head voice)
fuzz  = 0.22
tone  = 0.68
level = 0.42

# TS off — the Muff and the amp do the work.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# 2026-10-18: low 0.35 → 0.20 (-7.2 dB @ 100 Hz). The cut now happens before
# the Muff, so the humbucker's low end never saturates in the first place.
[preamp_eq]
enabled = true
low  = 0.20
mid  = 0.58
high = 0.54

# Uni-Vibe off — the RA-200-style motion is handled by the chorus below.
[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

# ── Clean Boost (Colorsound Power Boost style) ───────────────────────────────
# +3.6 dB of linear drive into the Hiwatt (0.15 × 24 dB) with the bass shelf
# cut (0.35 = -3.6 dB @ 120 Hz). This restores the push lost when the Muff's
# sustain came down, without adding fuzz to the lows.
[boost]
enabled = true
gain    = 0.15
treble  = 0.50
bass    = 0.35

# ── Amp ───────────────────────────────────────────────────────────────────────
# Hiwatt DR103 at modest gain: enough to bloom and sing, with headroom so the
# Muff is a voice, not the whole sound. Bass 0.20 → 0.15 in the 2026-10-18
# clarity pass; the pre-EQ and boost shelves do the low-end work.
[amp]
model  = "hiwatt"
gain   = 0.34
bass   = 0.15
mid    = 0.30
treble = 0.62
presence = 0.56
master = 0.48

# ── Cabinet ───────────────────────────────────────────────────────────────────
# WEM 4×12 with Fane Crescendos, near on-axis with a light ribbon blend — bright
# and present, with a little room for depth.
[cabinet]
model     = "wem"
mic_pos   = 0.50
mic_blend = 0.25
mic_room  = 0.28

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# Gentle final shaping: lows tucked, mids reinforced, a breath of air on top.
[eq]
enabled = false
low  = 0.42
mid  = 0.58
high = 0.56

# ── Chorus (RA-200 stand-in) ──────────────────────────────────────────────────
# A slow, low-mix chorus stands in for the Yamaha RA-200 rotary that the studio
# sources place alongside the Hiwatt. The RA-200 was mixed very low; 0.12 keeps
# the motion without washing the pick attack.
[chorus]
enabled = true
rate  = 0.45
depth = 0.50
mix   = 0.12

# ── Flanger (Electric Mistress) ───────────────────────────────────────────────
# Off for the studio take: the sources disagree on whether the Mistress was on
# the album, and the RA-200/chorus path is the closer match. Kept here for the
# live/Pulse flavor — turn it on and lower the chorus to taste.
[flanger]
enabled  = false
rate     = 0.15
depth    = 0.30
feedback = 0.20
mix      = 0.20
type     = 1.0   # Electric Mistress (mono)

# ── Delay ─────────────────────────────────────────────────────────────────────
# Digital delay, ~440 ms: the studio sources point to an MXR/TC digital unit,
# not a Binson. One clean repeat behind the phrase keeps the note articulate.
# Low feedback and mix keep it a dimension, not a fog.
[delay]
type     = 0.0   # Digital ping-pong
enabled  = true
time     = 0.88
feedback = 0.30
mix      = 0.22

# ── Reverb ────────────────────────────────────────────────────────────────────
# A medium, fairly damped room — depth without smearing the articulation.
[reverb]
enabled = true
room = 0.45
damp = 0.50
mix  = 0.16

[master]
width = 1.0
