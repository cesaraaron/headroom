# Thresholds for Clippy lints that CI actually enables. CI runs
# `cargo clippy --all-targets --all-features -- -D warnings`, which turns on the
# default groups only. Config keys for restriction/pedantic/nursery lints were
# removed in the 2026-11-16 audit because those groups are not enabled
# (see docs/audit-2026-11-16.md #45).

too-many-arguments-threshold = 7
type-complexity-threshold = 250

# Naming
single-char-binding-names-threshold = 4
enum-variant-name-threshold = 3

# Performance
vec-box-size-threshold = 4096
array-size-threshold = 512000
stack-size-threshold = 512000

# Errors
large-error-threshold = 128
