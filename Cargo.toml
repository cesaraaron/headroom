[package]
name = "headroom"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
description = "A guitar amplifier and effects simulator in your terminal"
repository = "https://github.com/cesaraaron/headroom"
authors = ["Cesar Sosa <aaronash@live.com>"]
license-file = "LICENSE"
readme = "README.md"
publish = false

[dependencies]
cpal = "0.18.1"
rust-embed = { version = "8.11.0", features = ["include-exclude"] }
rtrb = "0.3.4"
ratatui = "0.30.2"
crossterm = "0.29.0"
anyhow = "1.0.102"
atomic_float = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1"
dirs = "6.0.0"
hound = "3.5.1"

# Practice / jam-along backing-track decoding. Pure-Rust, no C toolchain; the
# feature set is trimmed to the formats a player would point at (MP3, WAV, FLAC).
# `wav` enables the RIFF *reader* only; the PCM *codec* is the separate `pcm`
# feature — without it every WAV (including our own dry captures) fails to decode.
symphonia = { version = "0.5.4", default-features = false, features = [
    "mp3",
    "wav",
    "pcm",
    "flac",
] }

# CLAP plugin hosting — only pulled in with the `clap` feature so the base amp
# builds with no extra dependencies. `clack` is a pure-Rust, safe wrapper over the
# CLAP ABI (no C toolchain required).
clack-host = { version = "0.1.0", optional = true }
clack-extensions = { version = "0.1.0", features = [
    "clack-host",
    "audio-ports",
    "params",
    "state",
    "log",
], optional = true }
midir = "0.11.0"

# Audio Unit hosting (macOS only) — raw CoreAudio/AudioToolbox bindings. It also
# re-exports the CoreFoundation string calls we need to read component/parameter
# names (with a matching CFStringRef type), so no separate core-foundation crate is
# required. Only pulled in with the `au` feature, and only on macOS where the
# frameworks exist.
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = { version = "0.2.18", optional = true }

[features]
# Plugin hosting is on by default so it works out of the box (and ships in the
# release binaries). Build with `--no-default-features` for a minimal amp with no
# CLAP dependencies / no plugin-loading FFI.
default = ["clap", "au", "pipewire"]
# Host third-party CLAP effect plugins as a stereo insert in the signal chain.
clap = ["dep:clack-host", "dep:clack-extensions"]
# Host macOS Audio Unit plugins as an amp-position override. A no-op on non-macOS
# targets (the dependencies are gated to macOS), so it's safe to leave in `default`.
au = ["dep:coreaudio-sys"]
# Prefer the PipeWire host on Linux. PipeWire owns the audio devices and schedules
# the graph properly, avoiding the constant overruns ("buffer underrun or
# overrun") and sample-format/plug-layer pitfalls of grabbing raw ALSA `hw`
# devices while PipeWire is running. Requires libpipewire-0.3 at build time on
# Linux; a no-op on other platforms. Drop it for a minimal ALSA-only build.
pipewire = ["cpal/pipewire"]

[dev-dependencies]
# Golden-snapshot testing for the terminal UI: render to an in-memory buffer and
# diff against a committed `.snap`. Re-bless intentional changes with
# `cargo insta review` (or set `INSTA_UPDATE=always`).
insta = "1.48.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Lint policy is documented in CONTRIBUTING.md -> "Code style". CI enforces the
# default Clippy groups via `cargo clippy --all-targets --all-features -- -D warnings`.
# There is deliberately no `[workspace.lints.*]` opt-in: the strict
# restriction/pedantic groups are not enabled (see docs/audit-2026-11-16.md #4).
